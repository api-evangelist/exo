- name: AI
  count: 12
  events:
  - name: AI_SELECT_MODE
    description: User changes AI Assist view in current procedure
    trigger: This event captures the user's navigation across various views within our AI solution for
      each preset. It provides insights into user preferences and engagement with different views.
  - name: AI_BEGIN_RETROSPECTIVE
    description: AI Assist transitions to retrospective workflow
    trigger: Upon activation, the AI initiates either a manual capture or ScanAssist auto-capture. Following
      video capture, the system transitions to Retrospective view, displaying the results. This event
      monitors user entry into Retrospective view, providing insights into whether they successfully accessed
      the results and the time taken to reach this stage.
  - name: AI_CANCEL_RETROSPECTIVE
    description: User cancels retrospective workflow
    trigger: The Retrospective view UI allows users to save their results or cancel the Retrospective
      View and retake the image. This event captures instances where users choose to cancel the Retrospective
      view and retake the image, providing insights into the frequency of this occurrence and aiding in
      understanding user behaviour patterns.
  - name: AI_COMPLETE_RETROSPECTIVE
    description: User completes retrospective workflow
    trigger: The Retrospective view UI allows users to save their results or cancel the Retrospective
      View and retake the image. This event captures instances where users choose to complete the retrospective
      you and save the results, providing insights into the frequency of this occurrence and aiding in
      understanding user behaviour patterns.
  - name: AI_LENIENCY_CHANGE
    description: User changes AI Assist leniency
    trigger: We offer various levels of sensitivity for the scan assist auto capture feature, catering
      to users with varying degrees of ultrasound imaging expertise. This event allows us to monitor instances
      where users adjust the sensitivity level of auto capture, ranging from 1 to 4. For instance, the
      display on Pulse reflects changes in AI Assist sensitivity to level 3.
  - name: AI_SCRUB_RETROSPECTIVE
    description: User scrubs in retrospective workflow
    trigger: In the retrospective view, we provide users with a scrubber tool that allows them to navigate
      through the captured frames and assess the accuracy of the results. This event enables us to monitor
      user interactions with the scrubber and gain insights into their reliance on visual information
      when evaluating the accuracy of the outcomes.
  - name: AI_SCRUB_KEY_FRAME_LEFT
    description: User scrubs to previous key frame in retrospective workflow
    trigger: In addition to the scrubber tool, we have also incorporated right and left arrow keys on
      the sides of the scrubber tool. These arrow keys serve the purpose of enhancing user experience
      when navigating through frames and evaluating result accuracy. The software automatically flags
      keyframes for diagnosis, and the arrow keys allow users to navigate between these keyframes, skipping
      the intermediate frames. This event enables us to monitor the frequency of arrow key usage compared
      to the scrubber tool.
  - name: AI_SCRUB_KEY_FRAME_RIGHT
    description: User scrubs to next key frame in retrospective workflow
    trigger: In addition to the scrubber tool, we have also incorporated right and left arrow keys on
      the sides of the scrubber tool. These arrow keys serve the purpose of enhancing user experience
      when navigating through frames and evaluating result accuracy. The software automatically flags
      keyframes for diagnosis, and the arrow keys allow users to navigate between these keyframes, skipping
      the intermediate frames. This event enables us to monitor the frequency of arrow key usage compared
      to the scrubber tool.
  - name: AI_UPDATE_ANNOTATION
    description: User adjusts annotation added by AI Assist
    trigger: In the retrospective view, we incorporate modifiable measurements and contours onto the frames
      to enhance user comprehension of the AI algorithms' calculations. This event enables us to monitor
      instances where users alter these AI-generated annotations.
  - name: AI_SAVE_RETROSPECTIVE_RESULTS
    description: User saves retrospective results
    trigger: The Retrospective view UI allows users to save their results or cancel the Retrospective
      View and retake the image. This event captures instances where users choose to save the results,
      providing insights into the frequency of this occurrence and aiding in understanding user behaviour
      patterns.
