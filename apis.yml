aid: exo
name: Exo
description: 'Exo (Exo Imaging, Inc.) is a Santa Clara, California medical imaging
  company building a handheld ultrasound ecosystem for point-of-care ultrasound (POCUS).
  Its silicon-based Exo Iris handheld probe pairs an FDA-cleared, on-device AI suite
  (SweepAI, cardiac and lung assessment, hemodynamics indicators) with Exo Works, an
  AWS-hosted POCUS workflow, documentation, billing, QA and credentialing platform.
  Exo Works is device-agnostic and connects to hospital systems over DICOM (modality
  worklist, PACS/VNA) and HL7 (ADT, ultrasound orders, exam results), with SAML single
  sign-on and Active Directory. Exo publishes no public developer API, OpenAPI, SDK
  or developer portal; its integration surface is the DICOM/HL7 interface engine
  documented for hospital IT, and its production API host (api.prod.exoworks.inc) is
  private to the Exo Works clients.'
